{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Admin User Management</h2>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th style="width: 180px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.role }}</td>
                    <td>
                        <button class="btn btn-warning btn-sm me-2"
                            onclick="showEditForm('{{ user.username }}', '{{ user.role }}')">Edit</button>
                        <form action="/admin/delete_user" method="POST" style="display:inline;">
                            <input type="hidden" name="username" value="{{ user.username }}">
                            <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Are you sure you want to delete {{ user.username }}?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <h3 class="mt-5 mb-3">Add User</h3>
    <form action="/admin/add_user" method="POST" class="row g-3 align-items-center mb-4">
        <div class="col-md-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
        </div>
        <div class="col-md-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="role" name="role">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-success">Add User</button>
        </div>
    </form>

    <div id="editForm" class="card shadow p-4" style="display:none; max-width: 500px;">
        <h3 class="mb-3">Edit User</h3>
        <form action="/admin/edit_user" method="POST" class="row g-3">
            <input type="hidden" id="original_username" name="original_username">
            <div class="col-12">
                <label for="edit_username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="edit_username" name="username" required>
            </div>
            <div class="col-12">
                <label for="edit_role" class="form-label">Role:</label>
                <select class="form-select" id="edit_role" name="role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="hideEditForm()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
function showEditForm(username, role) {
    document.getElementById('editForm').style.display = 'block';
    document.getElementById('original_username').value = username;
    document.getElementById('edit_username').value = username;
    document.getElementById('edit_role').value = role;
}
function hideEditForm() {
    document.getElementById('editForm').style.display = 'none';
}
</script>
{% endblock %}
